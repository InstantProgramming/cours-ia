<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cours IA</title>
  <script>
    // thème et taille du texte appliqués avant le premier rendu (pas de flash)
    try {
      const p = JSON.parse(localStorage.getItem("coursia-prefs") || "{}");
      if (p.theme && p.theme !== "auto") document.documentElement.dataset.theme = p.theme;
      if (p.size) document.documentElement.dataset.size = p.size;
    } catch {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.17.2/dist/browser/index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.17.2/dist/browser/index.iife.js"></script>
</head>
<body>
  <aside id="sidebar">
    <a class="brand" href="#">
      <span class="logo">✦</span>
      <div><b>Cours IA</b><small>fiches de major de promo</small></div>
    </a>
    <a class="nav-link" data-nav="home" href="#"><span class="ico">🏠</span>Accueil</a>
    <a class="nav-link" data-nav="nouveau" href="#nouveau"><span class="ico">＋</span>Nouveau cours</a>
    <a class="nav-link" data-nav="reviser" href="#reviser"><span class="ico">🧠</span>Réviser<span class="badge" id="due-badge" hidden></span></a>
    <div class="nav-title">Mes cours</div>
    <input class="input side-search" id="side-search" placeholder="Rechercher…" autocomplete="off">
    <nav id="lesson-list"></nav>
    <div class="side-foot">
      <a class="nav-link" data-nav="reglages" href="#reglages"><span class="ico">⚙</span>Réglages<span class="badge" id="update-badge" hidden>1</span></a>
      <div class="version" id="version"></div>
    </div>
  </aside>
  <main id="main"></main>
  <script type="module" src="app.js"></script>
</body>
</html>
